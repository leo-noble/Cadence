<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B181C" />
    <meta name="description" content="Cadence — a calm, premium spaced-repetition study companion. Study in rhythm." />
    <title>Cadence — Study in rhythm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var MIGRATION = {
          linen: { theme: 'forest', themeMode: 'light' },
          fog: { theme: 'slate', themeMode: 'light' },
          graphite: { theme: 'slate', themeMode: 'dark' },
          verdant: { theme: 'forest', themeMode: 'dark' },
        }
        try {
          var prefs = JSON.parse(localStorage.getItem('cadence.prefs') || '{}')
          var theme = prefs.theme || 'slate'
          var mode = prefs.themeMode || 'light'
          var migrated = MIGRATION[theme]
          if (migrated) {
            theme = migrated.theme
            mode = migrated.themeMode
          }
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.mode = mode
        } catch (e) {
          document.documentElement.dataset.theme = 'slate'
          document.documentElement.dataset.mode = 'light'
        }
        // Only allow theme/mode switches to cross-fade once the first frame
        // has actually painted — otherwise the browser would visibly
        // transition FROM the default palette on every fresh load.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.documentElement.classList.add('theme-ready')
          })
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
